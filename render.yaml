services:
  - type: web
    name: autocrm-whatsapp
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt && python -m scripts.seed"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MODEL_EXTRACT
        value: claude-haiku-4-5
      - key: MODEL_COMPOSE
        value: claude-opus-5
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
